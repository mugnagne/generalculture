<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprites de Valdorn</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
  <style>
    :root { --bg: #1A1932; --card: #2A2F4E; --ink: #F9E6CF; --muted: #92A1B9; --gold: #EDAB50; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font-family: "Pixelify Sans", system-ui, sans-serif; font-variant-ligatures: none; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; color: var(--gold); }
    p.note { color: var(--muted); margin: 0 0 16px; }
    label { color: var(--muted); }
    section { background: var(--card); border: 2px solid #424C6E; padding: 12px; margin-bottom: 16px; }
    h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .meta { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
    .anims { display: flex; flex-wrap: wrap; gap: 10px; }
    figure { margin: 0; background: #0E071B; padding: 6px; }
    figcaption { font-size: .8rem; color: var(--muted); max-width: 220px; }
    figcaption b { color: var(--ink); }
    canvas { display: block; image-rendering: pixelated; background:
      repeating-conic-gradient(#14132a 0% 25%, #191832 0% 50%) 0 0 / 16px 16px; }
    .ground { border-bottom: 1px dashed var(--gold); }
  </style>
</head>
<body>
  <h1>Sprites de Valdorn</h1>
  <p class="note">Toutes les animations lues dans <code>assets/sprites/manifest.json</code>. La ligne pointillée marque le sol ;
    les personnages sont à l'échelle du jeu (soldats et chevaliers à la taille du Maréchal, boss ×1,75).</p>
  <p><label>Zoom <input id="zoom" type="range" min="1" max="4" value="2"></label></p>
  <div id="list"></div>
  <script type="module" src="src/debug.js"></script>
</body>
</html>
